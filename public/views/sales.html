<!-- Vistas de sales. Los marcadores reciben valores escapados o fragmentos de vista. -->

<template id="invoices-page-1">
  {{{head}}}
  <section class="pos-terminal" aria-label="Venta en curso">
    <div class="pos-commandbar">
      <button type="button" class="btn primary" data-action="focus-payment">
        <kbd>F9</kbd> Cobrar
      </button>
      <button type="button" class="btn" data-action="focus-code">
        <kbd>F2</kbd> Ingresar código
      </button>
      <button type="button" class="btn" data-action="focus-product">
        <kbd>F4</kbd> Buscar artículo
      </button>
      <button type="button" class="btn" data-action="invoice-history">
        <kbd>F8</kbd> Historial
      </button>
      <button type="button" class="btn" data-action="clear-sale">
        Vaciar venta
      </button>
    </div>
    <form id="sale-form">
      <div class="pos-counter">
        <div class="pos-total-display">
          <span>Total a cobrar</span
          ><strong id="pos-total" aria-live="polite"></strong
          ><small id="pos-units"></small>
        </div>
        <div class="pos-counter-discount">
          {{{discount}}}<span class="form-help">Precios con IVA incluido</span>
        </div>
      </div>
      <div class="pos-register">
        <div class="pos-invoice">
          <div class="pos-entry">
            <div class="pos-code-row">
              {{{barcode}}}<button
                type="button"
                class="btn primary"
                id="scan-product"
              >
                Ingresar código
              </button>
            </div>
            <div class="pos-product-row">
              {{{product}}}{{{quantity}}}<button
                id="add-sale-line"
                type="button"
                class="btn"
              >
                Agregar
              </button>
            </div>
          </div>
          <p class="error pos-error" role="alert"></p>
          <div id="cart-table"></div>
          <div id="sale-totals" class="pos-totals"></div>
          <div class="pos-invoice-footer">
            <span>Revisa los artículos antes de cobrar.</span
            ><button type="submit" class="btn primary" id="open-checkout">
              Cobrar venta · F9
            </button>
          </div>
        </div>
      </div>
      <div class="pos-status" id="pos-last-item" role="status">
        Caja lista · Ingresa el primer artículo para comenzar.
      </div>
    </form>
  </section>
</template>

<template id="pos-totals">
  <div><span>Importe con IVA</span><b>{{{gross}}}</b></div>
  <div><span>Descuento</span><b>− {{{discount}}}</b></div>
  <div><span>Subtotal sin IVA</span><b>{{{net}}}</b></div>
  <div><span>IVA</span><b>{{{vat}}}</b></div>
</template>

<template id="pos-checkout">
  <form id="checkout-form" class="pos-checkout">
    <div class="pos-payment-methods" role="group" aria-label="Medio de pago">
      <button type="button" class="btn" data-payment="Efectivo">Efectivo</button
      ><button type="button" class="btn" data-payment="Tarjeta">Tarjeta</button
      ><button type="button" class="btn" data-payment="SINPE">SINPE</button>
      <button type="button" class="btn" data-payment="Mixto">Mixto</button>
    </div>
    <div class="pos-customer-fields">
      {{{customer}}}{{{identification}}}{{{notes}}}
    </div>
    <div class="pos-payment-body">
      <section class="pos-payment-amounts" aria-label="Resumen del cobro">
        <p id="payment-label"></p>
        <span>Total a pagar</span
        ><strong class="pos-payment-total">{{{total}}}</strong>
        <div id="mixed-fields" class="pos-mixed-fields" hidden>
          <p class="form-help">
            Indica los montos confirmados en tarjeta y SINPE. El resto se cobra
            en efectivo.
          </p>
          {{{cardPaid}}}{{{sinpePaid}}}
          <div class="pos-mixed-remainder">
            <span>Parte en efectivo</span
            ><strong id="mixed-cash-amount" aria-live="polite"></strong>
          </div>
        </div>
        <div id="cash-field">
          {{{paid}}}
          <div class="pos-change">
            <span id="change-label">Vuelto</span
            ><strong id="change-amount" aria-live="polite"></strong>
          </div>
        </div>
        <p id="electronic-payment" class="form-help" hidden>
          Confirma que recibiste el pago antes de emitir la factura.
        </p>
        <p class="pos-ticket-note">
          Ticket de {{{width}}} mm · Podrás imprimirlo al guardar.
        </p>
      </section>
      <fieldset class="pos-keyboard" id="cash-keyboard">
        <legend>Ingresar efectivo</legend>
        <div class="pos-keypad">{{{keys}}}</div>
        <div class="pos-denominations">{{{denominations}}}</div>
        <button type="button" class="btn block" id="exact-cash">
          Monto exacto
        </button>
      </fieldset>
    </div>
    <p class="error" role="alert"></p>
    <div class="pos-checkout-footer">
      <button type="button" class="btn" data-action="close">
        Volver a la venta</button
      ><button type="submit" class="btn primary" id="issue-invoice">
        Emitir factura · F10
      </button>
    </div>
  </form>
</template>
<template id="pos-cash-key"
  ><button
    type="button"
    class="btn"
    data-cash-key="{{{key}}}"
    aria-label="{{{label}}}"
  >
    {{{label}}}
  </button></template
>
<template id="pos-cash-denomination"
  ><button type="button" class="btn" data-cash-add="{{{value}}}">
    + {{{label}}}
  </button></template
>

<template id="invoices-page-2">
  <strong>{{{esc}}}</strong><small>{{{esc2}}} · {{{stock}}} disponibles</small>
</template>

<template id="invoices-page-3">
  <input
    class="cart-input"
    type="number"
    min="1"
    max="{{{stock}}}"
    step="1"
    value="{{{qty}}}"
    data-sale-line="{{{i}}}"
    aria-label="Cantidad de {{{esc}}}"
  />
</template>

<template id="invoices-page-4">
  <button
    class="btn small danger"
    type="button"
    data-remove-sale="{{{i}}}"
    aria-label="Quitar {{{esc}}}"
  >
    ×
  </button>
</template>

<template id="invoices-page-6">
  <div class="total-line"><span>Vuelto</span><b>{{{crc}}}</b></div>
</template>

<template id="invoices-page-5">
  <div class="total-line"><span>Importe con IVA</span><b>{{{crc}}}</b></div>
  <div class="total-line"><span>Descuento</span><span>− {{{crc2}}}</span></div>
  <div class="total-line">
    <span>Subtotal sin IVA</span><span>{{{crc3}}}</span>
  </div>
  <div class="total-line"><span>IVA</span><span>{{{crc4}}}</span></div>
  <div class="total-line grand"><span>Total</span><span>{{{crc5}}}</span></div>
  {{{slot6}}}
</template>

<template id="invoice-history-1">
  {{{filters}}}
  <div id="invoice-list"></div>
</template>

<template id="invoice-history-2">
  {{{idLabel}}}<small>{{{date}}}</small>
</template>

<template id="view-invoice-1">
  <div class="ticket-layout">
    <div id="ticket-preview">{{{ticketContent}}}</div>
    <aside class="ticket-actions">
      <span class="badge green">Venta guardada</span>
      <h3>Comprobante de venta</h3>
      <p>
        La factura se conserva en Ventas guardadas. Puedes consultar e imprimir
        este ticket cuando lo necesites.
      </p>
      {{{select}}}
      <p class="form-help">
        Selecciona tu impresora térmica o guarda el ticket como PDF. Imprime a
        escala 100%, sin encabezados ni pies del navegador.
      </p>
      {{{button}}}{{{slot4}}}
      <p class="form-help">
        Comprobante académico; no es factura electrónica de Hacienda.
      </p>
    </aside>
  </div>
</template>

<template id="void-invoice-form-1">
  <div class="wide">
    <p>
      Se conservará la factura y se devolverán sus cantidades al inventario.
      Esta operación solo puede realizarse una vez.
    </p>
    {{{field}}}
  </div>
</template>

<template id="saved-sales-page-2">
  <a class="btn primary" href="#invoices">＋ Nueva venta</a>
</template>

<template id="saved-sales-page-1">
  {{{head}}}
  <div class="pos-history-summary">
    <b>{{{length}}} comprobantes</b><span>Ventas vigentes: {{{crc}}}</span
    ><span>{{{slot4}}} anuladas</span>
  </div>
  {{{filters}}}
  <div class="card" id="listing"></div>
</template>
