<template id="icon-1">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">{{{slot1}}}</svg>
</template>

<template id="status-badge-1">
  <span class="badge {{{slot1}}}">{{{esc}}}</span>
</template>

<template id="button-1">
  <button
    type="button"
    class="btn {{{style}}}"
    data-action="{{{action}}}"
    data-id="{{{id}}}"
  >
    {{{label}}}
  </button>
</template>

<template id="table-2">
  <th scope="col" {{{slot1}}}>{{{esc}}}</th>
</template>

<template id="table-4">
  <tr>
    <td colspan="{{{length}}}" class="empty">{{{esc}}}</td>
  </tr>
</template>

<template id="table-1">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          {{{slot1}}}
        </tr>
      </thead>
      <tbody>
        {{{slot2}}}
      </tbody>
    </table>
  </div>
</template>

<template id="tr-2">
  <td class="{{{className}}}">{{{c}}}</td>
</template>

<template id="tr-1">
  <tr>
    {{{slot1}}}
  </tr>
</template>

<template id="options-1">
  <option value="{{{esc}}}" {{{slot2}}}>{{{esc3}}}</option>
</template>

<template id="field-1">
  <label class="field"
    >{{{label}}}<input
      name="{{{name}}}"
      type="{{{type}}}"
      value="{{{esc}}}"
      {{{extra}}}
  /></label>
</template>

<template id="select-1">
  <label class="field"
    >{{{label}}}<select name="{{{name}}}" aria-label="{{{esc}}}" {{{extra}}}>
      {{{options}}}
    </select></label
  >
</template>

<template id="head-1">
  <div class="page-head">
    <div>
      <h1>{{{title}}}</h1>
      <p>{{{subtitle}}}</p>
    </div>
    {{{action}}}
  </div>
</template>

<template id="brand-1">
  <div class="brand">
    <img src="/favicon.svg" alt="" />
    <div>SIPRO<small>Gestión del negocio</small></div>
  </div>
</template>

<template id="filters-1">
  <div class="filters">{{{field}}}{{{slot2}}}</div>
</template>

<template id="offer-row-1">
  <div class="offer-row">{{{select}}}{{{field}}}{{{field3}}}{{{button}}}</div>
</template>

<template id="purchase-tax-detail-3">
  {{{esc}}}<small>Código {{{esc2}}}</small>
</template>

<template id="purchase-tax-detail-2">
  <details class="tax-detail" open>
    <summary>Desglose de impuestos y exoneraciones ({{{length}}})</summary>
    {{{table}}}
  </details>
</template>

<template id="purchase-tax-detail-4">
  <section class="purchase-charges">
    <h3>Otros cargos del proveedor</h3>
    {{{table}}}
  </section>
</template>

<template id="purchase-tax-detail-5">
  <div class="total-line">
    <span>Otros impuestos</span><span>{{{crc}}}</span>
  </div>
</template>

<template id="purchase-tax-detail-6">
  <div class="total-line">
    <span>Impuestos asumidos / de fábrica</span><span>− {{{crc}}}</span>
  </div>
</template>

<template id="purchase-tax-detail-7">
  <div class="total-line"><span>Otros cargos</span><span>{{{crc}}}</span></div>
</template>

<template id="purchase-tax-detail-8">
  <div class="total-line">
    <span>IVA devuelto</span><span>− {{{crc}}}</span>
  </div>
</template>

<template id="purchase-tax-detail-1">
  <div class="purchase-financials">
    <div class="purchase-breakdown">{{{slot1}}} {{{slot2}}}</div>
    <div class="purchase-totals">
      <div class="total-line"><span>Subtotal neto</span><b>{{{crc}}}</b></div>
      <div class="total-line">
        <span>IVA{{{slot4}}}</span><span>{{{crc5}}}</span>
      </div>
      {{{slot6}}} {{{slot7}}} {{{slot8}}} {{{slot9}}}
      <div class="total-line grand">
        <span>Total del comprobante</span><span>{{{crc10}}}</span>
      </div>
    </div>
  </div>
</template>

<template id="purchase-invoice-content-2">
  <div class="xml-provenance">
    <b>Factura electrónica {{{esc}}}</b><span>Clave: {{{esc2}}}</span
    ><small
      >XML original conservado. La importación no valida su firma ni lo envía a
      Hacienda.</small
    >
  </div>
</template>

<template id="purchase-invoice-content-4">
  <small>XML: {{{esc}}} · {{{esc2}}}</small>
</template>

<template id="purchase-invoice-content-3">
  {{{esc}}}<small>{{{esc2}}}</small>{{{slot3}}}
</template>

<template id="purchase-invoice-content-5">
  {{{crc}}}<small>{{{slot2}}}</small>
</template>

<template id="purchase-invoice-content-1">
  {{{slot1}}}
  <div class="detail-grid">
    <div><small>Proveedor</small>{{{esc}}}<br />{{{esc3}}}</div>
    <div><small>Número de factura del proveedor</small>{{{esc4}}}</div>
    <div><small>Fecha de emisión</small>{{{date}}}</div>
    <div><small>Estado de pago</small>{{{statusBadge}}}<br />{{{slot7}}}</div>
    <div><small>Origen</small>{{{slot8}}}</div>
    <div><small>Registro</small>{{{date9}}} · {{{esc10}}}</div>
  </div>
  {{{table}}} {{{purchaseTaxDetail}}}{{{purchaseStockReceipt}}}
  <p>{{{esc14}}}</p>
</template>

<template id="purchase-stock-receipt-1">
  <div class="stock-receipt">
    <h3>Inventario registrado al recibir el pedido</h3>
    <p>
      Esta factura está vinculada a {{{idLabel}}}. Las cantidades ya ingresaron
      con su recepción y no se sumaron otra vez.
    </p>
  </div>
</template>

<template id="purchase-stock-receipt-2">
  <p class="form-help">
    Compra directa: la mercadería se ingresó al guardar la factura. Consulta el
    movimiento de compra en Inventario.
  </p>
</template>

<template id="purchase-stock-receipt-4">
  {{{esc}}}<small>{{{esc2}}}</small>
</template>

<template id="purchase-stock-receipt-3">
  <section class="stock-receipt">
    <h3>Entrada de inventario confirmada</h3>
    <p>
      Saldos al registrar esta compra el {{{date}}}. Los movimientos posteriores
      pueden cambiar la existencia actual.
    </p>
    {{{table}}}
  </section>
</template>

<template id="ticket-content-2">
  <div class="receipt-void">FACTURA ANULADA</div>
</template>

<template id="ticket-content-3">
  <div>Identificación: {{{esc}}}</div>
</template>

<template id="ticket-content-5">
  <div class="receipt-small">Descuento incluido: {{{crc}}}</div>
</template>

<template id="ticket-content-4">
  <section class="receipt-item">
    <b>{{{esc}}}</b>
    <div class="receipt-row">
      <span>{{{qty}}} × {{{crc}}}</span><span>{{{crc4}}}</span>
    </div>
    {{{slot5}}}
    <div class="receipt-small">IVA {{{tax}}}% incluido: {{{crc7}}}</div>
  </section>
</template>

<template id="ticket-content-6">
  <div class="receipt-row">
    <span>Descuento aplicado</span><span>{{{crc}}}</span>
  </div>
</template>

<template id="ticket-content-7">
  <p class="receipt-note">{{{esc}}}</p>
</template>

<template id="ticket-content-8">
  <p class="receipt-note">Anulación: {{{date}}}<br />Motivo: {{{esc}}}</p>
</template>

<template id="ticket-content-1">
  <article
    class="receipt receipt-{{{width}}}"
    aria-label="Ticket de venta {{{idLabel}}}"
  >
    <header class="receipt-header">
      <strong>SIPRO</strong>
      <div>MINI SÚPER / LICORERA</div>
      <div>TICKET DE VENTA</div>
    </header>
    {{{slot3}}}
    <div class="receipt-rule"></div>
    <div class="receipt-row"><b>{{{idLabel4}}}</b><span>{{{date}}}</span></div>
    <div>Cajero: {{{esc}}}{{{slot7}}}</div>
    <div>Cliente: {{{esc8}}}</div>
    {{{slot9}}}
    <div class="receipt-rule"></div>
    <div class="receipt-row">
      <b>ARTÍCULO / CANT. × PRECIO</b><b>IMPORTE</b>
    </div>
    {{{slot10}}}
    <div class="receipt-rule"></div>
    {{{slot11}}}
    <div class="receipt-row">
      <span>Subtotal sin IVA</span><span>{{{crc}}}</span>
    </div>
    <div class="receipt-row"><span>IVA</span><span>{{{crc13}}}</span></div>
    <div class="receipt-row receipt-total">
      <b>TOTAL CRC</b><b>{{{crc14}}}</b>
    </div>
    <div class="receipt-rule"></div>
    <div class="receipt-row">
      <span>Pago: {{{esc15}}}</span><span>{{{crc16}}}</span>
    </div>
    {{{paymentBreakdown}}}
    <div class="receipt-row"><b>Vuelto</b><b>{{{crc17}}}</b></div>
    {{{slot18}}}{{{slot19}}}
    <footer class="receipt-footer">
      <b>¡Gracias por su compra!</b>
      <div>{{{idLabel20}}} · {{{slot21}}} artículos</div>
      <div>Comprobante académico.<br />Sin validez de factura electrónica.</div>
    </footer>
  </article>
</template>

<template id="ticket-payment-part">
  <div class="receipt-row">
    <span>{{{method}}} aplicado</span><span>{{{amount}}}</span>
  </div>
</template>
